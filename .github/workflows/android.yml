name: RT TV Arena APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare game
        run: |
          mkdir -p www
          cp RT_TV_Arena_V10*.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/admob@7
          npx cap init "RT TV Arena" com.rttvarena.game --web-dir www
          npx cap add android
          sed -i '/<\/application>/i\    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7966484606235237~5047501366" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RT-TV-Arena
          path: android/app/build/outputs/apk/debug/app-debug.apk
