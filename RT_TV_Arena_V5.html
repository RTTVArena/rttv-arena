const logos={},pending={};function loadSelected(){for(let side of ['a','b']){let k=$(side).value;if(logos[k]||pending[k])continue;let im=new Image();im.crossOrigin='anonymous';pending[k]=true;im.onload=()=>{logos[k]=im;delete pending[k];draw()};im.onerror=()=>{delete pending[k];$('status').textContent='Logo yüklenemedi; takım kısaltması kullanılıyor.'};im.src='https://a.espncdn.com/i/teamlogos/soccer/500/'+teams[k][4]+'.png'}};['logoA','logoB'].forEach((id,i)=>$(id).onchange=e=>{let f=e.target.files[0];if(!f)return;let key=$(i?'b':'a').value,img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{logos[key]=img;URL.revokeObjectURL(url);draw()};img.src=url});let dest;function audio(){if(!ac){ac=new AudioContext();dest=ac.createMediaStreamDestination()}ac.resume()}function crowd(){try{audio();let n=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=n.getChannelData(0),v=0;for(let i=0;i<d.length;i++){v=.92*v+.08*(Math.random()*2-1);d[i]=v*3}let b=ac.createBufferSource(),gain=ac.createGain(),f=ac.createBiquadFilter();b.buffer=n;f.type='bandpass';f.frequency.value=650;gain.gain.setValueAtTime(.01,ac.currentTime);gain.gain.linearRampToValueAtTime(.55,ac.currentTime+.25);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+2);b.connect(f);f.connect(gain);gain.connect(ac.destination);gain.connect(dest);b.start()}catch(e){}}function turkishGoal(){try{audio();let dur=2.8,n=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate),d=n.getChannelData(0);let phases=Array.from({length:18},()=>Math.random()*6.28);for(let i=0;i<d.length;i++){let t=i/ac.sampleRate,e=Math.min(1,t/.14)*Math.min(1,(dur-t)/.55),v=0;for(let j=0;j<18;j++){let f=115+j*8+12*Math.sin(t*3+j);let ph=6.283*f*t+phases[j];v+=(Math.sin(ph)+.45*Math.sin(2*ph)+.23*Math.sin(3*ph))*.035}d[i]=e*(v+.12*(Math.random()*2-1))}let b=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();b.buffer=n;f.type='lowpass';f.frequency.value=1700;v.gain.value=.65;b.connect(f);f.connect(v);v.connect(ac.desti
